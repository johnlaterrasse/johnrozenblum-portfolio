backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

i18n:
  structure: single_file
  locales: [fr, en]
  default_locale: fr

collections:
  - name: home
    label: Accueil
    label_singular: Accueil
    files:
      - name: content
        file: data/content.json
        label: Contenu
        i18n: true
        fields:
          - name: hero
            label: Hero
            widget: object
            i18n: true
            fields:
              - name: tagline
                label: Tagline
                widget: string
                i18n: true
              - name: name
                label: Nom
                widget: text
                i18n: true
              - name: subtitle
                label: Sous-titre
                widget: string
                i18n: true
              - name: cta
                label: Bouton CTA
                widget: string
                i18n: true
          - name: intro
            label: Introduction
            widget: object
            i18n: true
            fields:
              - name: title
                label: Titre
                widget: text
                i18n: true
              - name: p1
                label: Paragraphe 1
                widget: text
                i18n: true
              - name: p2
                label: Paragraphe 2
                widget: text
                i18n: true
          - name: decoration
            label: Décoration
            widget: object
            i18n: true
            fields:
              - name: title
                label: Titre
                widget: string
                i18n: true
              - name: subtitle
                label: Sous-titre
                widget: string
                i18n: true
          - name: design
            label: Design
            widget: object
            i18n: true
            fields:
              - name: title
                label: Titre
                widget: string
                i18n: true
              - name: subtitle
                label: Sous-titre
                widget: string
                i18n: true
          - name: dj
            label: DJ
            widget: object
            i18n: true
            fields:
