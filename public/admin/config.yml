                label: Titre
                widget: string
                i18n: true
              - name: upcomingTitle
                label: Titre "Prochain événement"
                widget: string
                i18n: true
              - name: actionTitle
                label: Titre "En action"
                widget: string
                i18n: true
          - name: event
            label: Événement
            widget: object
            i18n: true
            fields:
